function slideHTML(elements,editable){return `<div class="slide ${editable?'editing':''}" ${editable?'id="editSlide"':'aria-label="Modello di diapositiva ordinata"'}>${['title','body','image'].map(id=>{const e=elements[id],isImage=id==='image';return `<div class="slide-el ${editable&&state.m3.selected===id?'selected':''}" ${editable?`data-element="${id}" tabindex="0" role="button" aria-label="Seleziona ${id==='title'?'titolo':id==='body'?'testo':'immagine'}"`:''} style="left:${e.x}%;top:${e.y}%;width:${e.w}%;height:${isImage?e.w*16/9:id==='title'?13:57}%;${isImage?'':`font-size:${e.font/8}cqw;color:${e.color};font-weight:${id==='title'?700:400};white-space:pre-line;`} ">${isImage?labIllustration():slideText[id]}</div>`}).join('')}</div>`}
function evaluateSlide(){const {title:t,body:b,image:i}=state.m3.elements;const close=(a,b,tol)=>Math.abs(a-b)<=tol;return [
['Titolo in alto, allineato a sinistra',close(t.x,8,5)&&close(t.y,10,5)],
['Titolo grande e leggibile (30–38)',t.font>=30&&t.font<=38],
['Spazio sufficiente al titolo (78–90%)',t.w>=78&&t.w<=90],
['Testo nella colonna sinistra',close(b.x,8,5)&&close(b.y,34,5)],
['Testo leggibile (20–24)',b.font>=20&&b.font<=24],
['Colonna del testo proporzionata (42–51%)',b.w>=42&&b.w<=51],
['Immagine nella colonna destra',close(i.x,63,5)&&close(i.y,32,6)],
['Immagine proporzionata (25–33%)',i.w>=25&&i.w<=33&&i.x+i.w<=100&&i.y+i.w*16/9<=100],
['Colori dei testi ad alto contrasto',[t,b].every(e=>e.color==='#183c35'||e.color==='#162b2c'||e.color==='#26724c')],
['Elementi separati e dentro la diapositiva',t.x>=0&&t.x+t.w<=100&&t.y>=0&&t.y+13<=b.y&&t.y+13<=i.y&&b.x>=0&&b.y+57<=100&&b.x+b.w+2<=i.x&&i.x+i.w<=100&&i.y+i.w*16/9<=100]
]}
function mission3(){const m=state.m3,selected=m.selected,e=m.elements[selected],isImage=selected==='image',locked=state.completed[2],checks=evaluateSlide();app.innerHTML=heading(3)+`<div class="instructions">Ripara la diapositiva seguendo il modello. Seleziona un oggetto e trascinalo, usa le frecce della tastiera (1% alla volta) o i cursori. Modifica dimensioni, colore e allineamento; poi premi <b>Verifica</b>. Ogni controllo vale 2,5 punti.</div><details open style="margin-bottom:18px"><summary>Modello finale e misure di riferimento</summary><div style="display:flex;gap:25px;align-items:center;flex-wrap:wrap;margin-top:13px"><div class="reference">${slideHTML(target,false)}</div><p class="learning" style="max-width:550px">Titolo: X 8%, Y 10%, larghezza 84%, testo 34.<br>Testo: X 8%, Y 34%, larghezza 47%, testo 22.<br>Immagine: X 63%, Y 32%, larghezza 29%.<br>Colore consigliato: verde scuro. Sono accettate piccole differenze.<br><b>Le proporzioni dell’illustrazione restano bloccate per non deformarla.</b></p></div></details><div class="editor-layout"><section class="panel"><div class="toolbar">${[['title','Titolo'],['body','Testo'],['image','Immagine']].map(([id,name])=>`<button class="small ${selected===id?'primary':''}" data-select="${id}">${name}</button>`).join('')}<span style="margin-left:auto;font:11px monospace;align-self:center">16:9 / EDITOR LAB</span></div><div id="slideContainer">${slideHTML(m.elements,true)}</div><p class="learning">Il bordo arancione indica l’oggetto selezionato. L’immagine si ridimensiona con il cursore «Larghezza».</p></section><aside class="panel control"><h3>${isImage?'Immagine selezionata':selected==='title'?'Titolo selezionato':'Testo selezionato'}</h3>${[['x','Posizione X',0,95],['y','Posizione Y',0,90],['w','Larghezza',15,95]].map(([key,label,min,max])=>`<div><label for="ctrl-${key}">${label}<output id="out-${key}">${Math.round(e[key])}%</output></label><input id="ctrl-${key}" data-prop="${key}" type="range" min="${min}" max="${max}" value="${e[key]}" ${locked?'disabled':''}></div>`).join('')}${!isImage?`<div><label for="ctrl-font">Dimensione testo <output id="out-font">${e.font}</output></label><input id="ctrl-font" data-prop="font" type="range" min="12" max="44" value="${e.font}" ${locked?'disabled':''}></div><div><label for="ctrl-color">Colore testo</label><select id="ctrl-color" ${locked?'disabled':''}>${[['#183c35','Verde scuro'],['#162b2c','Nero inchiostro'],['#26724c','Verde bosco'],['#c9c9c9','Grigio chiaro'],['#d8d8d8','Grigio pallido'],['#fa7048','Arancione']].map(([c,n])=>`<option value="${c}" ${e.color===c?'selected':''}>${n}</option>`).join('')}</select></div>`:''}<div><button class="small" id="alignLeft" ${locked?'disabled':''}>Allinea a sinistra (8%)</button><button class="small" id="alignCenter" ${locked?'disabled':''}>Centra orizzontalmente</button></div><p class="learning">Allinea il titolo e il testo al margine sinistro. Allinea l’immagine alla colonna destra con la posizione X.</p></aside></div><div class="mission-actions"><button class="primary" id="checkSlide" ${locked?'disabled':''}>Verifica la diapositiva</button><button class="ghost" id="resetSlide" ${locked?'disabled':''}>Riparti dalla diapositiva disordinata</button><span class="muted" style="font-size:13px">Puoi verificare e migliorare tutte le volte che vuoi.</span></div><div id="slideChecks">${m.checked||locked?`<ul class="checks">${checks.map(([label,pass])=>`<li class="${pass?'pass':''}">${pass?'✓':'○'} ${label}</li>`).join('')}</ul>`:''}</div>${feedbackHTML()}${nextButton(3,m.checked||locked)}`;
app.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{m.selected=b.dataset.select;persist();mission3()});
app.querySelectorAll('[data-prop]').forEach(input=>input.oninput=()=>{const key=input.dataset.prop;m.elements[m.selected][key]=Number(input.value);$('#out-'+key).textContent=input.value+(key==='font'?'':'%');slideChanged()});
if($('#ctrl-color'))$('#ctrl-color').onchange=ev=>{e.color=ev.target.value;slideChanged()};
$('#alignLeft').onclick=()=>{e.x=8;slideChanged();mission3()};$('#alignCenter').onclick=()=>{e.x=(100-e.w)/2;slideChanged();mission3()};
$('#checkSlide').onclick=()=>{m.checked=true;state.scores[2]=evaluateSlide().filter(c=>c[1]).length*2.5;announce(`${evaluateSlide().filter(c=>c[1]).length} controlli superati su 10. ${state.scores[2]===25?'Ottimo lavoro! La diapositiva è pronta.':'Leggi i controlli e migliora la diapositiva, oppure conferma il punteggio ottenuto.'}`,state.scores[2]===25?'good':'');persist();mission3()};
$('#resetSlide').onclick=()=>confirmAction('Ripristinare la diapositiva?','Le modifiche di questa missione e il relativo punteggio saranno azzerati.',()=>{state.m3=initial().m3;state.scores[2]=0;persist();feedback='';mission3()});bindSlideObjects();bindActions(3);$('#finishBtn').onclick=()=>{if(locked)navigate('home');else if(state.scores[2]<25)confirmAction('Confermi la diapositiva?',`Hai ottenuto ${fmt(state.scores[2])} punti su 25. Puoi ancora migliorare: confermando, questo punteggio diventa definitivo.`,()=>finishMission(3));else finishMission(3)}}
function slideChanged(){state.m3.checked=false;state.scores[2]=0;$('.point-tag').textContent='0 / 25 PT';$('#slideContainer').innerHTML=slideHTML(state.m3.elements,true);$('#slideChecks').innerHTML='';$('#finishBtn').disabled=true;persist();bindSlideObjects()}
function bindSlideObjects(){app.querySelectorAll('[data-element]').forEach(el=>{el.onkeydown=ev=>{if(state.completed[2])return;const id=el.dataset.element;if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();state.m3.selected=id;mission3();return}const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(moves[ev.key]){ev.preventDefault();const e=state.m3.elements[id];state.m3.selected=id;e.x=Math.max(0,Math.min(100-e.w,e.x+moves[ev.key][0]));const height=id==='image'?e.w*16/9:id==='title'?13:57;e.y=Math.max(0,Math.min(Math.max(0,100-height),e.y+moves[ev.key][1]));state.m3.checked=false;state.scores[2]=0;persist();mission3();app.querySelector(`[data-element="${id}"]`).focus()}};
el.onpointerdown=ev=>{if(state.completed[2]||ev.button!==0)return;ev.preventDefault();const id=el.dataset.element;state.m3.selected=id;app.querySelectorAll('[data-element]').forEach(n=>n.classList.toggle('selected',n===el));const rect=$('#editSlide').getBoundingClientRect(),e=state.m3.elements[id],start={x:ev.clientX,y:ev.clientY,ex:e.x,ey:e.y};el.setPointerCapture(ev.pointerId);let moved=false;el.onpointermove=p=>{const dx=(p.clientX-start.x)/rect.width*100,dy=(p.clientY-start.y)/rect.height*100;if(Math.abs(dx)+Math.abs(dy)>.3)moved=true;const height=id==='image'?e.w*16/9:id==='title'?13:57;e.x=Math.round(Math.max(0,Math.min(100-e.w,start.ex+dx)));e.y=Math.round(Math.max(0,Math.min(Math.max(0,100-height),start.ey+dy)));el.style.left=e.x+'%';el.style.top=e.y+'%'};el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;if(moved){state.m3.checked=false;state.scores[2]=0}persist();mission3()};el.onpointercancel=()=>{el.onpointermove=null;persist();mission3()}}})}
const riddles=[
 {title:'Un foglio vero',question:'Ho finito una relazione in Google Documenti. Voglio consegnarne una copia su carta. Quale dispositivo di output mi serve?',answers:['stampante','la stampante'],hints:['Il monitor mostra il documento, ma non produce fogli.','Il suo nome comincia con «stamp».'],explain:'La stampante è un dispositivo hardware di output: produce la copia cartacea.'},
 {title:'Si tocca oppure si avvia?',question:'Google Documenti e Google Presentazioni non sono parti fisiche del computer: sono programmi. Qual è il nome della categoria a cui appartengono?',answers:['software','il software'],hints:['Le parti fisiche si chiamano hardware.','La parola inglese che cerchi comincia con «soft».'],explain:'Il software è l’insieme dei programmi. Hardware indica le parti fisiche, come monitor e tastiera.'},
 {title:'Parole in ingresso',question:'Devo scrivere il titolo della mia relazione: quale periferica di input mi permette di inserire lettere premendo dei tasti?',answers:['tastiera','la tastiera'],hints:['Il mouse serve soprattutto a puntare e selezionare.','Ha i tasti con lettere, numeri e simboli.'],explain:'La tastiera invia al computer le lettere digitate: è un dispositivo di input.'},
 {title:'Una storia a diapositive',question:'Devo illustrare una ricerca alla classe con una sequenza di diapositive, titoli e immagini. Completa il nome: Google …',answers:['presentazioni','google presentazioni'],hints:['Un documento di testo è adatto a una relazione da leggere.','È lo strumento esercitato nella missione precedente.'],explain:'Google Presentazioni serve a creare e mostrare presentazioni composte da diapositive.'},
 {title:'La relazione ordinata',question:'Devo scrivere una relazione con paragrafi, un titolo in grassetto e un elenco puntato. Completa il nome dello strumento adatto: Google …',answers:['documenti','google documenti','docs','google docs'],hints:['Non occorre una sequenza di diapositive: il risultato è un documento di testo.','Il suo nome italiano comincia con «Doc».'],explain:'Google Documenti permette di scrivere e formattare testi: grassetto, paragrafi ed elenchi aiutano a organizzarli.'}
];
function normalize(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.!?]/g,'').replace(/\s+/g,' ')}
function mission4(){const m=state.m4,all=m.solved.every(Boolean),locked=state.completed[3],q=riddles[m.current];app.innerHTML=heading(4)+`<div class="instructions">Risolvi i cinque enigmi: ogni risposta rivela una cifra. Copia le cifre <b>da sinistra a destra</b> e inseriscile nel tastierino. Gli indizi sono gratuiti, gli errori sono recuperabili.</div><div class="code-slots" aria-label="Cifre del codice">${m.digits.map((d,i)=>`<div class="code-slot ${m.solved[i]?'':'hidden'}" aria-label="Cifra ${i+1}: ${m.solved[i]?d:'da scoprire'}">${m.solved[i]?d:'?'}</div>`).join('')}</div>${all?`<section class="panel vault ${locked?'unlock':''}"><div class="eyebrow" style="justify-content:center">${locked?'ACCESSO CONSENTITO':'CASSAFORTE DEL LABORATORIO'}</div><h2>${locked?'Il laboratorio è salvo.':'Il codice è completo.'}</h2><p class="muted">Inserisci le cinque cifre con i pulsanti oppure con la tastiera del PC. Gli errori qui non tolgono punti.</p><div class="code-display" id="codeEntry" role="status" aria-label="Codice inserito">${(m.entry+'_____').slice(0,5)}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','←','0','C'].map(n=>`<button data-key="${n}" ${locked?'disabled':''} aria-label="${n==='←'?'Cancella ultima cifra':n==='C'?'Cancella codice':n}">${n}</button>`).join('')}</div><button class="primary" id="unlockBtn" ${locked?'disabled':''}>Sblocca la cassaforte →</button>${feedbackHTML()}</section>`:`<div class="riddle-nav" aria-label="Scegli enigma">${riddles.map((r,i)=>`<button data-riddle="${i}" class="${m.current===i?'active':''} ${m.solved[i]?'done':''}" aria-label="Enigma ${i+1}${m.solved[i]?', risolto':''}">${m.solved[i]?'✓':i+1}</button>`).join('')}</div><section class="panel riddle-card"><div class="eyebrow">ENIGMA 0${m.current+1} / 05</div><h3>${q.title}</h3><p>${q.question}</p>${m.solved[m.current]?`<div class="feedback good">✓ ${q.explain} Cifra sbloccata: <b>${m.digits[m.current]}</b>.</div><button class="primary" id="nextRiddle" style="margin-top:18px">Vai a un enigma da risolvere →</button>`:`<form class="answer-form" id="riddleForm"><label class="sr-only" for="riddleAnswer">La tua risposta</label><input id="riddleAnswer" placeholder="Scrivi la risposta…" autocomplete="off" maxlength="60" required><button class="primary">Verifica risposta</button></form><button class="ghost small" id="hintBtn" ${m.hints[m.current]>=2?'disabled':''}>${m.hints[m.current]===0?'Dammi un indizio':'Un altro indizio'} (${Math.min(2,m.hints[m.current])}/2)</button>${q.hints.slice(0,m.hints[m.current]).map(h=>`<div class="hint-box">✦ ${h}</div>`).join('')}${feedbackHTML()}`}<p class="learning">Valore di questo enigma: ${Math.max(1,3-m.errors[m.current])} punti. Scrivi solo la parola richiesta; maiuscole e accenti non contano.</p></section>`}<div class="mission-actions"><button class="ghost" id="backBtn">Salva e torna alla base</button>${locked?'<button class="primary" id="showFinal">Vedi il risultato finale →</button>':''}</div>`;
$('#backBtn').onclick=()=>{persist();navigate('home')};if(locked)$('#showFinal').onclick=()=>navigate('final');
if(all){app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>enterKey(b.dataset.key));$('#unlockBtn').onclick=unlockVault}
else{app.querySelectorAll('[data-riddle]').forEach(b=>b.onclick=()=>{m.current=Number(b.dataset.riddle);feedback='';persist();mission4()});if($('#riddleForm'))$('#riddleForm').onsubmit=ev=>{ev.preventDefault();answerRiddle($('#riddleAnswer').value)};if($('#hintBtn'))$('#hintBtn').onclick=()=>{m.hints[m.current]=Math.min(2,m.hints[m.current]+1);persist();mission4()};if($('#nextRiddle'))$('#nextRiddle').onclick=()=>{m.current=m.solved.findIndex(v=>!v);feedback='';persist();mission4()}}}
function answerRiddle(answer){const m=state.m4,i=m.current;if(m.solved[i]||state.completed[3])return;if(!normalize(answer)){toast('Scrivi una risposta prima di verificare.');return}if(riddles[i].answers.includes(normalize(answer))){m.solved[i]=true;state.scores[3]+=Math.max(1,3-m.errors[i]);announce(`Esatto! ${riddles[i].explain} Hai sbloccato la cifra ${m.digits[i]}.`,'good');toast(`Enigma ${i+1} risolto: cifra ${m.digits[i]}`)}else{m.errors[i]++;announce('Non ancora. Rileggi la richiesta e prova un indizio: puoi sempre recuperare.','bad')}persist();mission4()}
function enterKey(key){const m=state.m4;if(state.completed[3])return;if(/^\d$/.test(key)&&m.entry.length<5)m.entry+=key;else if(key==='←')m.entry=m.entry.slice(0,-1);else if(key==='C')m.entry='';$('#codeEntry').textContent=(m.entry+'_____').slice(0,5);persist()}
function unlockVault(){if(state.completed[3])return;const m=state.m4;if(!m.solved.every(Boolean))return;if(m.entry===m.digits.join('')){finishMission(4)}else{announce(m.entry.length<5?'Mancano delle cifre. Il codice deve contenerne cinque.':'Codice diverso: rileggi le cifre da sinistra a destra. Premi C e riprova.','bad');mission4()}}
document.addEventListener('keydown',e=>{if(view!==4||!state.m4.solved.every(Boolean)||state.completed[3]||$('#confirmDialog').open)return;if(/^\d$/.test(e.key)){e.preventDefault();enterKey(e.key)}else if(e.key==='Backspace'){e.preventDefault();enterKey('←')}else if(e.key==='Delete'){e.preventDefault();enterKey('C')}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();unlockVault()}});
function titleFor(score){return score>=75?'Leggenda dell’informatica':score>=60?'Esperto del laboratorio':score>=40?'Tecnico informatico':'Apprendista digitale'}
function finalScreen(){const score=total(),title=titleFor(score);app.innerHTML=`<section class="result"><div class="eyebrow" style="justify-content:center">OPERAZIONE COMPLETATA / LABORATORIO RIATTIVATO</div><div class="trophy">★</div><h1>Missione compiuta,<br>${escapeHTML(state.nickname)}.</h1><p class="muted">Hai fatto lavorare insieme occhi, logica e creatività.</p><div class="result-score">${fmt(score)} <small>/ 80</small></div><span class="tag" style="background:var(--lime);font-size:15px">${title}</span><div class="stats"><div><b>${timeText(state.elapsed)}</b><span>TEMPO ATTIVO</span></div><div><b>${state.completed.filter(Boolean).length} / 4</b><span>MISSIONI COMPLETATE</span></div><div><b>${Math.round(score/80*100)}%</b><span>PUNTI CONQUISTATI</span></div></div><div class="report">${missions.map((m,i)=>`<div>0${i+1} / ${m.title}<strong>${fmt(state.scores[i])} / ${m.max}</strong></div>`).join('')}</div><p class="learning">Hai esercitato hardware e software, input e output, Google Documenti e le basi di una presentazione ordinata.</p><div class="mission-actions" style="justify-content:center"><button class="primary" id="printCert">Stampa attestato / Salva PDF</button><button id="downloadCert">Scarica attestato HTML</button><button class="ghost" id="returnBase">Torna alla base</button></div><p class="learning">Per un PDF, scegli «Salva come PDF» nella finestra di stampa. Per una nuova sfida usa «Ricomincia» in alto.</p></section>`;$('#printCert').onclick=()=>{buildCertificate();window.print()};$('#downloadCert').onclick=downloadCertificate;$('#returnBase').onclick=()=>navigate('home')}
function certificateContent(){return `<p style="letter-spacing:4px">OPERAZIONE PC</p><h1>Attestato di missione</h1><p>La sfida del laboratorio</p><p>Si attesta che</p><h2>${escapeHTML(state.nickname)}</h2><p>ha completato le quattro missioni di informatica<br>e conquistato il titolo di</p><h2>${titleFor(total())}</h2><p class="cert-score">${fmt(total())} / 80 punti</p><p>Tempo attivo: ${timeText(state.elapsed)} · Missioni completate: 4 / 4</p><p>Hardware e software · Input e output<br>Google Documenti · Google Presentazioni</p><p style="margin-top:40px">${escapeHTML(state.finalDate||new Date().toLocaleDateString('it-IT'))}</p><p style="font-size:12px">Attestato didattico generato dal gioco OPERAZIONE PC.</p>`}
function buildCertificate(){$('#certificate').innerHTML=certificateContent()}
function downloadCertificate(){const html='<!DOCTYPE html><html lang="it"><meta charset="utf-8"><title>Attestato OPERAZIONE PC</title><style>body{font-family:Arial,sans-serif;color:#162b2c;background:#f5f3e9;text-align:center;margin:30px;padding:50px 20px;border:5px double #162b2c}h1{font-size:42px}h2{font-size:30px}.cert-score{font-size:45px;font-weight:bold}p{line-height:1.6}@media print{body{background:white}}</style>'+certificateContent()+'</html>';const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Attestato-Operazione-PC.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=document.createElement('div');box.className='celebration';box.setAttribute('aria-hidden','true');for(let i=0;i<35;i++){const c=document.createElement('i');c.className='confetti';c.style.cssText=`left:${Math.random()*100}%;background:${['#d4f85a','#fa7048','#26724c'][i%3]};animation-delay:${Math.random()*.6}s;transform:rotate(${Math.random()*180}deg)`;box.append(c)}document.body.append(box);setTimeout(()=>box.remove(),3500)}
window.addEventListener('beforeprint',()=>{if(state.finished)buildCertificate()});
persist();render();
</script>
